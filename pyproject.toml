[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapel"
version = "0.1.0"
description = "Adaptive Doubly-Robust Pseudo-outcome Ensemble Learner for CATE estimation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3",
]
keywords = ["causal-inference", "cate", "treatment-effects", "meta-learner"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/manhthai1706/ADAPEL"

[tool.setuptools.packages.find]
include = ["adapel*"]
